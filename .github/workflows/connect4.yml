name: Connect Four

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: connect4
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'c4|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play the move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python scripts/connect4.py

      - name: Commit board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json assets/connect4.svg README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "game: connect four move [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/c4_comment.md
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason completed
