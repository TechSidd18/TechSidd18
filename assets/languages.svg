<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 150" width="950" height="150"><style>
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dot{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dot{animation:dot 2.6s ease-in-out infinite}
.bar{transform-origin:30px 0;animation:grow 1.4s ease-out both}</style><rect width="950" height="150" rx="14" fill="#0E0E10"/><circle class="dot" cx="34" cy="26" r="3.5" fill="#A4161A"/><text class="mono" x="46" y="30" font-size="11" letter-spacing="1.6" fill="#C8A45C">TOP LANGUAGES</text><text class="mono" x="920" y="30" font-size="10.5" letter-spacing="1.6" fill="#7E786B" text-anchor="end">BY CODE SIZE</text><line x1="30" y1="46" x2="920" y2="46" stroke="#C8A45C" stroke-opacity=".25"/><g class="bar"></g><text class="mono" x="30" y="112" font-size="12" fill="#7E786B">no language data yet</text><line x1="30" y1="140" x2="920" y2="140" stroke="#C8A45C" stroke-opacity=".25"/></svg>